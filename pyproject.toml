[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-watcher"
version = "0.1.0"
description = "Мониторинг сильных и аномальных движений на Московской бирже (акции, облигации, фьючерсы)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
moex-watcher = "moex_watcher.cli:main"

[tool.setuptools]
packages = ["moex_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
