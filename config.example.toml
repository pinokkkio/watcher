# Скопируйте в config.toml и поправьте под себя. Все параметры необязательные.

[general]
# Рынки: shares (TQBR), etf (TQTF), ofz (TQOB), corp_bonds (TQCB), futures (RFUD)
watch = ["shares", "ofz", "corp_bonds", "futures"]
poll_interval_sec = 30        # период опроса
history_days = 60             # глубина истории для σ и среднего оборота, торговых дней
db_path = "data/history.sqlite"
alerts_log = "data/alerts.jsonl"   # "" — не писать журнал
digest_interval_min = 60      # сводка «самые волатильные сегодня»; 0 — выключить
digest_top = 10
console = true

# Пороги по классам активов: shares / bonds / futures.
# Указывайте только то, что хотите поменять.
[thresholds.shares]
day_levels = [3, 5, 7, 10, 15]   # % к закрытию прошлого дня — «сильное движение»
fast_window_min = 5              # окно быстрого движения, мин
fast_move_pct = 1.5              # % за окно — «сильное быстрое движение»
z_day = 3.0                      # аномалия: дневное изменение в σ
z_fast = 4.0                     # аномалия: изменение за окно в σ
rvol = 3.0                       # аномалия: оборот ×N к норме на это время
min_value_today = 3_000_000      # фильтр ликвидности: оборот сегодня, ₽
min_avg_value = 10_000_000       # фильтр ликвидности: средний дневной оборот, ₽
cooldown_min = 15

[thresholds.bonds]
day_levels = [1, 2, 3, 5, 10]
fast_move_pct = 0.7

[thresholds.futures]
day_levels = [2, 4, 6, 10]
fast_move_pct = 1.0

# Свой режим торгов, например фьючерсы на юань отдельно не нужны,
# а вот акции в режиме T+ USD или другие доски — так:
# [markets.my_board]
# asset_class = "shares"
# engine = "stock"
# market = "shares"
# board = "TQBR"
# title = "Мои акции"

[telegram]
# Секреты удобнее задавать через переменные окружения (.env):
# TELEGRAM_TOKEN, TELEGRAM_CHANNEL, TELEGRAM_PROXY, TELEGRAM_PROXY_USER, TELEGRAM_PROXY_PASSWORD
# token = "123456:ABC..."   # бот от @BotFather
# channel = "@moex_alerts"  # канал: @имя, t.me/имя или -100… (бот — админ канала)
# Прокси используется только для запросов к Telegram (к бирже — напрямую).
# proxy = "https://proxy.example.com:3128"   # https:// — TLS до прокси, http:// — CONNECT
# proxy_user = "user"
# proxy_password = "secret"                  # спецсимволы экранировать не нужно
# proxy_ca = "certs/proxy-ca.pem"            # если сертификат прокси самоподписанный
batch_sec = 60    # копить сигналы и отправлять одним сообщением раз в N секунд
max_lines = 30    # максимум инструментов в сообщении, остальные — «…и ещё N»

[webhook]
# url = "https://example.com/hook"

[iss]
# Логин MOEX Passport. С платной подпиской ISS отдаёт данные без 15-минутной задержки.
# login = ""
# password = ""
